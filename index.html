=\"card\"><div class=\"ico\">✦</div><h3>Microsoft 365 Copilot</h3><p><b>Best for:</b> Work across Word, Excel, PowerPoint, Outlook and Teams.<br><br><b>Context:</b> Emails, files, chats and meetings you already have permission to access.</p></div><div class=\"card\"><div class=\"ico\">🏢</div><h3>Deloitte Sidekick</h3><p><b>Best for:</b> Deloitte professional work and repeatable deliverables.<br><br><b>Context:</b> Firm-approved workflows, sources, skills and risk controls.</p></div></div><div class=\"callout\">Rule of thumb: use the AI experience closest to the context and quality controls your task needs.</div></div></section>","<section class=\"slide center\"><div class=\"inner center\"><div class=\"quizIntro\"><div class=\"quizBurst\">🎯</div><div class=\"eyebrow\">Interactive Challenge</div><h1 class=\"grad\">Quiz Time!</h1><p class=\"sub\">Twelve scenarios. Choose who should primarily handle each task: Maya or M365 Copilot.</p><div class=\"quizRules\"><div class=\"quizRule\">A · Maya<br><small>Human judgment</small></div><div class=\"quizRule\">B · M365 Copilot<br><small>AI assistance</small></div></div><button class=\"btn hero-btn\" onclick=\"goTo(current+1)\">Start Quiz ▶</button></div></div></section>","<section class=\"slide \"><div class=\"inner \"><div class=\"scenarioLayout\"><div class=\"scenarioMain\"><div class=\"eyebrow\">Human + AI Challenge · 1 of 12</div><h2>Two Versions of the Truth</h2><p class=\"scenarioText\">Maya is preparing for a status meeting. The project plan shows Friday as the delivery date, the latest email says Monday, and a Teams message says the date is still under discussion. The meeting begins in ten minutes.</p><p class=\"sub questionPrompt\">Who should lead the next move?</p><div class=\"quiz\"><div class=\"qopts\"><button class=\"qopt\" data-val=\"A\" onclick=\"answerQ(this,'B','q1')\">A · Maya <small>(Human judgment)</small></button><button class=\"qopt\" data-val=\"B\" onclick=\"answerQ(this,'B','q1')\">B · M365 Copilot <small>(AI assistance)</small></button></div><div class=\"revealArea\" id=\"fb-q1\"><div class=\"answerReveal whyBox\"><b>Why</b><br>The next move is to bring the conflicting evidence together quickly and show where each date came from. Maya must still confirm the authoritative date before communicating it.</div><div class=\"answerReveal takeawayBox\"><b>Key takeaway</b><br>Copilot should surface the conflicting evidence first. Maya confirms which date is valid.</div></div></div></div><aside class=\"namePicker\"><div class=\"pickerIcon\">🎲</div><div class=\"pickerLabel\">Random Answer Picker</div><div class=\"pickedName\" id=\"picker-q1\">Ready?</div><button class=\"btn pickerBtn\" onclick=\"pickName('q1',this)\">Pick a Name</button><small>Names are shared across all 12 questions.</small></aside></div></div></section>","<section class=\"slide \"><div class=\"inner \"><div class=\"scenarioLayout\"><div class=\"scenarioMain\"><div class=\"eyebrow\">Human + AI Challenge · 2 of 12</div><h2>“Can We Bring This Forward?”</h2><p class=\"scenarioText\">A leader asks Maya to bring a delivery forward by one week. The request sounds reasonable, but Maya remembers that another stakeholder requested additional review time and the project team has already committed to both expectations.</p><p class=\"sub questionPrompt\">Who should lead the next move?</p><div class=\"quiz\"><div class=\"qopts\"><button class=\"qopt\" data-val=\"A\" onclick=\"answerQ(this,'A','q2')\">A · Maya <small>(Human judgment)</small></button><button class=\"qopt\" data-val=\"B\" onclick=\"answerQ(this,'A','q2')\">B · M365 Copilot <small>(AI assistance)</small></button></div><div class=\"revealArea\" id=\"fb-q2\"><div class=\"answerReveal whyBox\"><b>Why</b><br>Copilot can reconstruct the commitments and help explore options, but Maya must handle the competing expectations and negotiate the path forward.</div><div class=\"answerReveal takeawayBox\"><b>Key takeaway</b><br>Copilot can recover the history. Maya must manage the competing commitments.</div></div></div></div><aside class=\"namePicker\"><div class=\"pickerIcon\">🎲</div><div class=\"pickerLabel\">Random Answer Picker</div><div class=\"pickedName\" id=\"picker-q2\">Ready?</div><button class=\"btn pickerBtn\" onclick=\"pickName('q2',this)\">Pick a Name</button><small>Names are shared across all 12 questions.</small></aside></div></div></section>","<section class=\"slide \"><div class=\"inner \"><div class=\"scenarioLayout\"><div class=\"scenarioMain\"><div class=\"eyebrow\">Human + AI Challenge · 3 of 12</div><h2>The Quiet Risk</h2><p class=\"scenarioText\">No one has formally raised a project risk, but several recent meeting comments mention delayed inputs, unavailable reviewers, and uncertainty about testing. Maya is unsure whether these are isolated comments or signs of a larger issue.</p><p class=\"sub questionPrompt\">Who should lead the next move?</p><div class=\"quiz\"><div class=\"qopts\"><button class=\"qopt\" data-val=\"A\" onclick=\"answerQ(this,'B','q3')\">A · Maya <small>(Human judgment)</small></button><button class=\"qopt\" data-val=\"B\" onclick=\"answerQ(this,'B','q3')\">B · M365 Copilot <small>(AI assistance)</small></button></div><div class=\"revealArea\" id=\"fb-q3\"><div class=\"answerReveal whyBox\"><b>Why</b><br>The immediate need is to examine the discussions collectively, identify recurring signals, and show the supporting evidence. Maya then judges whether the pattern should be treated as a risk.</div><div class=\"answerReveal takeawayBox\"><b>Key takeaway</b><br>Copilot should test whether a pattern exists. Maya decides what the pattern means.</div></div></div></div><aside class=\"namePicker\"><div class=\"pickerIcon\">🎲</div><div class=\"pickerLabel\">Random Answer Picker</div><div class=\"pickedName\" id=\"picker-q3\">Ready?</div><button class=\"btn pickerBtn\" onclick=\"pickName('q3',this)\">Pick a Name</button><small>Names are shared across all 12 questions.</small></aside></div></div></section>","<section class=\"slide \"><div class=\"inner \"><div class=\"scenarioLayout\"><div class=\"scenarioMain\"><div class=\"eyebrow\">Human + AI Challenge · 4 of 12</div><h2>The Polite but Tense Reply</h2><p class=\"scenarioText\">A stakeholder sends Maya a polite message asking why an agreed action has not been completed. Earlier messages show that the action depended on information the stakeholder’s team had not yet supplied.</p><p class=\"sub questionPrompt\">Who should lead the next move?</p><div class=\"quiz\"><div class=\"qopts\"><button class=\"qopt\" data-val=\"A\" onclick=\"answerQ(this,'A','q4')\">A · Maya <small>(Human judgment)</small></button><button class=\"qopt\" data-val=\"B\" onclick=\"answerQ(this,'A','q4')\">B · M365 Copilot <small>(AI assistance)</small></button></div><div class=\"revealArea\" id=\"fb-q4\"><div class=\"answerReveal whyBox\"><b>Why</b><br>Copilot can retrieve the history and prepare wording, but Maya needs to protect the relationship while clarifying the dependency and agreeing on a constructive next step.</div><div class=\"answerReveal takeawayBox\"><b>Key takeaway</b><br>The history matters, but the relationship matters more. Maya should lead the response.</div></div></div></div><aside class=\"namePicker\"><div class=\"pickerIcon\">🎲</div><div class=\"pickerLabel\">Random Answer Picker</div><div class=\"pickedName\" id=\"picker-q4\">Ready?</div><button class=\"btn pickerBtn\" onclick=\"pickName('q4',this)\">Pick a Name</button><small>Names are shared across all 12 questions.</small></aside></div></div></section>","<section class=\"slide \"><div class=\"inner \"><div class=\"scenarioLayout\"><div class=\"scenarioMain\"><div class=\"eyebrow\">Human + AI Challenge · 5 of 12</div><h2>The Action Maya Cannot Remember</h2><p class=\"scenarioText\">Maya remembers agreeing to send something before Friday. Maya cannot remember what it was, who requested it, or whether the commitment came from a meeting, an email, or a Teams conversation.</p><p class=\"sub questionPrompt\">Who should lead the next move?</p><div class=\"quiz\"><div class=\"qopts\"><button class=\"qopt\" data-val=\"A\" onclick=\"answerQ(this,'B','q5')\">A · Maya <small>(Human judgment)</small></button><button class=\"qopt\" data-val=\"B\" onclick=\"answerQ(this,'B','q5')\">B · M365 Copilot <small>(AI assistance)</small></button></div><div class=\"revealArea\" id=\"fb-q5\"><div class=\"answerReveal whyBox\"><b>Why</b><br>The immediate need is to search across Maya’s work and locate the likely commitment with its source.</div><div class=\"answerReveal takeawayBox\"><b>Key takeaway</b><br>Copilot should locate the commitment. Maya verifies it and completes the action.</div></div></div></div><aside class=\"namePicker\"><div class=\"pickerIcon\">🎲</div><div class=\"pickerLabel\">Random Answer Picker</div><div class=\"pickedName\" id=\"picker-q5\">Ready?</div><button class=\"btn pickerBtn\" onclick=\"pickName('q5',this)\">Pick a Name</button><small>Names are shared across all 12 questions.</small></aside></div></div></section>","<section class=\"slide \"><div class=\"inner \"><div class=\"scenarioLayout\"><div class=\"scenarioMain\"><div class=\"eyebrow\">Human + AI Challenge · 6 of 12</div><h2>A Recommendation Everyone Supports</h2><p class=\"scenarioText\">The project team agrees on a recommended approach. The supporting analysis is strong, but the recommendation requires accepting a risk that will remain unresolved until after launch.</p><p class=\"sub questionPrompt\">Who should lead the next move?</p><div class=\"quiz\"><div class=\"qopts\"><button class=\"qopt\" data-val=\"A\" onclick=\"answerQ(this,'A','q6')\">A · Maya <small>(Human judgment)</small></button><button class=\"qopt\" data-val=\"B\" onclick=\"answerQ(this,'A','q6')\">B · M365 Copilot <small>(AI assistance)</small></button></div><div class=\"revealArea\" id=\"fb-q6\"><div class=\"answerReveal whyBox\"><b>Why</b><br>Copilot can organize the evidence and articulate the implications, but accepting the unresolved risk requires accountable human judgment.</div><div class=\"answerReveal takeawayBox\"><b>Key takeaway</b><br>Agreement does not remove accountability. Maya must own the recommendation.</div></div></div></div><aside class=\"namePicker\"><div class=\"pickerIcon\">🎲</div><div class=\"pickerLabel\">Random Answer Picker</div><div class=\"pickedName\" id=\"picker-q6\">Ready?</div><button class=\"btn pickerBtn\" onclick=\"pickName('q6',this)\">Pick a Name</button><small>Names are shared across all 12 questions.</small></aside></div></div></section>","<section class=\"slide \"><div class=\"inner \"><div class=\"scenarioLayout\"><div class=\"scenarioMain\"><div class=\"eyebrow\">Human + AI Challenge · 7 of 12</div><h2>The Missing Expert</h2><p class=\"scenarioText\">Maya needs help with an unfamiliar issue. Maya does not know the correct technical term, which team owns it, or what role an expert would have. Maya only remembers seeing a similar problem mentioned during an older project.</p><p class=\"sub questionPrompt\">Who should lead the next move?</p><div class=\"quiz\"><div class=\"qopts\"><button class=\"qopt\" data-val=\"A\" onclick=\"answerQ(this,'B','q7')\">A · Maya <small>(Human judgment)</small></button><button class=\"qopt\" data-val=\"B\" onclick=\"answerQ(this,'B','q7')\">B · M365 Copilot <small>(AI assistance)</small></button></div><div class=\"revealArea\" id=\"fb-q7\"><div class=\"answerReveal whyBox\"><b>Why</b><br>Copilot can use the fragments Maya remembers to explore related work, discussions, and possible people. Maya then evaluates the suggestions and approaches the appropriate colleague.</div><div class=\"answerReveal takeawayBox\"><b>Key takeaway</b><br>Maya does not need the perfect search term. Copilot can help find credible starting points.</div></div></div></div><aside class=\"namePicker\"><div class=\"pickerIcon\">🎲</div><div class=\"pickerLabel\">Random Answer Picker</div><div class=\"pickedName\" id=\"picker-q7\">Ready?</div><button class=\"btn pickerBtn\" onclick=\"pickName('q7',this)\">Pick a Name</button><small>Names are shared across all 12 questions.</small></aside></div></div></section>","<section class=\"slide \"><div class=\"inner \"><div class=\"scenarioLayout\"><div class=\"scenarioMain\"><div class=\"eyebrow\">Human + AI Challenge · 8 of 12</div><h2>The Message That Is Correct but Unhelpful</h2><p class=\"scenarioText\">Maya reviews a project update containing accurate dates, risks, and actions. Nothing in the message is incorrect, but someone reading it may still not understand what decision is required or what should happen next.</p><p class=\"sub questionPrompt\">Who should lead the next move?</p><div class=\"quiz\"><div class=\"qopts\"><button class=\"qopt\" data-val=\"A\" onclick=\"answerQ(this,'A','q8')\">A · Maya <small>(Human judgment)</small></button><button class=\"qopt\" data-val=\"B\" onclick=\"answerQ(this,'A','q8')\">B · M365 Copilot <small>(AI assistance)</small></button></div><div class=\"revealArea\" id=\"fb-q8\"><div class=\"answerReveal whyBox\"><b>Why</b><br>Copilot can suggest improvements, but Maya needs to determine the purpose of the communication and what the audience genuinely needs to understand or do.</div><div class=\"answerReveal takeawayBox\"><b>Key takeaway</b><br>Correct information is not automatically effective communication. Maya defines the message’s purpose.</div></div></div></div><aside class=\"namePicker\"><div class=\"pickerIcon\">🎲</div><div class=\"pickerLabel\">Random Answer Picker</div><div class=\"pickedName\" id=\"picker-q8\">Ready?</div><button class=\"btn pickerBtn\" onclick=\"pickName('q8',this)\">Pick a Name</button><small>Names are shared across all 12 questions.</small></aside></div></div></section>","<section class=\"slide \"><div class=\"inner \"><div class=\"scenarioLayout\"><div class=\"scenarioMain\"><div class=\"eyebrow\">Human + AI Challenge · 9 of 12</div><h2>Seven Meetings, One Recurring Concern</h2><p class=\"scenarioText\">Over the last month, different people have raised concerns in seven meetings. The wording varies, some comments contradict one another, and no single meeting contains the full picture.</p><p class=\"sub questionPrompt\">Who should lead the next move?</p><div class=\"quiz\"><div class=\"qopts\"><button class=\"qopt\" data-val=\"A\" onclick=\"answerQ(this,'B','q9')\">A · Maya <small>(Human judgment)</small></button><button class=\"qopt\" data-val=\"B\" onclick=\"answerQ(this,'B','q9')\">B · M365 Copilot <small>(AI assistance)</small></button></div><div class=\"revealArea\" id=\"fb-q9\"><div class=\"answerReveal whyBox\"><b>Why</b><br>The immediate challenge is consolidating distributed evidence, detecting recurring themes, and preserving the source of each observation.</div><div class=\"answerReveal takeawayBox\"><b>Key takeaway</b><br>Copilot should assemble the pattern and its evidence. Maya decides whether action is required.</div></div></div></div><aside class=\"namePicker\"><div class=\"pickerIcon\">🎲</div><div class=\"pickerLabel\">Random Answer Picker</div><div class=\"pickedName\" id=\"picker-q9\">Ready?</div><button class=\"btn pickerBtn\" onclick=\"pickName('q9',this)\">Pick a Name</button><small>Names are shared across all 12 questions.</small></aside></div></div></section>","<section class=\"slide \"><div class=\"inner \"><div class=\"scenarioLayout\"><div class=\"scenarioMain\"><div class=\"eyebrow\">Human + AI Challenge · 10 of 12</div><h2>“Please Adjust the Update”</h2><p class=\"scenarioText\">A senior stakeholder sends Maya a message saying, “Please adjust the update before tomorrow.” The update covers scope, timing, risk, and ownership, but the stakeholder does not explain what needs to change.</p><p class=\"sub questionPrompt\">Who should lead the next move?</p><div class=\"quiz\"><div class=\"qopts\"><button class=\"qopt\" data-val=\"A\" onclick=\"answerQ(this,'A','q10')\">A · Maya <small>(Human judgment)</small></button><button class=\"qopt\" data-val=\"B\" onclick=\"answerQ(this,'A','q10')\">B · M365 Copilot <small>(AI assistance)</small></button></div><div class=\"revealArea\" id=\"fb-q10\"><div class=\"answerReveal whyBox\"><b>Why</b><br>Copilot can review previous feedback and suggest likely interpretations, but Maya should not treat an inference as a confirmed request. Maya needs to clarify the expectation.</div><div class=\"answerReveal takeawayBox\"><b>Key takeaway</b><br>Copilot can suggest what the stakeholder may mean. Maya confirms what the stakeholder actually means.</div></div></div></div><aside class=\"namePicker\"><div class=\"pickerIcon\">🎲</div><div class=\"pickerLabel\">Random Answer Picker</div><div class=\"pickedName\" id=\"picker-q10\">Ready?</div><button class=\"btn pickerBtn\" onclick=\"pickName('q10',this)\">Pick a Name</button><small>Names are shared across all 12 questions.</small></aside></div></div></section>","<section class=\"slide \"><div class=\"inner \"><div class=\"scenarioLayout\"><div class=\"scenarioMain\"><div class=\"eyebrow\">Human + AI Challenge · 11 of 12</div><h2>The Briefing with a Deadline</h2><p class=\"scenarioText\">A leader needs a one-page project briefing in 20 minutes. The relevant information is spread across a spreadsheet, two documents, recent emails, and meeting notes. Some points are repeated, and several updates may no longer be current.</p><p class=\"sub questionPrompt\">Who should lead the next move?</p><div class=\"quiz\"><div class=\"qopts\"><button class=\"qopt\" data-val=\"A\" onclick=\"answerQ(this,'B','q11')\">A · Maya <small>(Human judgment)</small></button><button class=\"qopt\" data-val=\"B\" onclick=\"answerQ(this,'B','q11')\">B · M365 Copilot <small>(AI assistance)</small></button></div><div class=\"revealArea\" id=\"fb-q11\"><div class=\"answerReveal whyBox\"><b>Why</b><br>Copilot should create the evidence-based first version and indicate the sources used. Maya must then verify currency, accuracy, and appropriateness before the briefing is shared.</div><div class=\"answerReveal takeawayBox\"><b>Key takeaway</b><br>Copilot creates the evidence-based starting point. Maya validates the briefing.</div></div></div></div><aside class=\"namePicker\"><div class=\"pickerIcon\">🎲</div><div class=\"pickerLabel\">Random Answer Picker</div><div class=\"pickedName\" id=\"picker-q11\">Ready?</div><button class=\"btn pickerBtn\" onclick=\"pickName('q11',this)\">Pick a Name</button><small>Names are shared across all 12 questions.</small></aside></div></div></section>","<section class=\"slide \"><div class=\"inner \"><div class=\"scenarioLayout\"><div class=\"scenarioMain\"><div class=\"eyebrow\">Human + AI Challenge · 12 of 12</div><h2>A Small Exception with a Large Precedent</h2><p class=\"scenarioText\">A stakeholder asks Maya to make a small exception to an established process. The exception appears harmless for this project, but approving it could create an expectation that other teams will request the same treatment.</p><p class=\"sub questionPrompt\">Who should lead the next move?</p><div class=\"quiz\"><div class=\"qopts\"><button class=\"qopt\" data-val=\"A\" onclick=\"answerQ(this,'A','q12')\">A · Maya <small>(Human judgment)</small></button><button class=\"qopt\" data-val=\"B\" onclick=\"answerQ(this,'A','q12')\">B · M365 Copilot <small>(AI assistance)</small></button></div><div class=\"revealArea\" id=\"fb-q12\"><div class=\"answerReveal whyBox\"><b>Why</b><br>Copilot can retrieve the process, identify previous examples, and outline possible implications. Maya must consider precedent, fairness, governance, and accountability.</div><div class=\"answerReveal takeawayBox\"><b>Key takeaway</b><br>The immediate request may be small, but the precedent is a human judgment.</div></div></div></div><aside class=\"namePicker\"><div class=\"pickerIcon\">🎲</div><div class=\"pickerLabel\">Random Answer Picker</div><div class=\"pickedName\" id=\"picker-q12\">Ready?</div><button cla r=\"16\"/></g></g></svg><div class=\"name\">Maya · Project Lead</div></div><div class=\"grow\"><div class=\"eyebrow\">Models of M365 Copilot Thinks</div><h2>Models of M365 Copilot</h2><p class=\"sub\">Not every request needs the same level of reasoning.</p><div class=\"grid three\"><div class=\"card\"><div class=\"ico\">1</div><h3>Quick Response</h3><p>Speed for simple requests, lookups, and straightforward questions.</p></div><div class=\"card\"><div class=\"ico\">2</div><h3>Think Deeper</h3><p>More reasoning for analysis, trade-offs, strategy, and recommendations.</p></div><div class=\"card\"><div class=\"ico\">3</div><h3>Auto</h3><p>Let M365 Copilot decide when the task needs more complexity or nuance.</p></div></div><div class=\"callout\"><b>Key takeaway:</b> M365 Copilot adapts the level of reasoning to give the best results. You stay in control and can adjust or override anytime.</div></div></div></div></section>","<section class=\"slide \"><div class=\"inner \"><div class=\"eyebrow\">Meet the M365 Copilot ecosystem</div><h2>Where does maya find 365 Copilot?</h2><p class=\"sub\">M365 Copilot can meet Maya inside familiar Microsoft 365 workspaces.</p><div class=\"ecosystemMap\"><div class=\"ecosystemColumn\"><span class=\"ecosystemLabel\">Tools</span><div class=\"ecoItem\">📧 Outlook</div><div class=\"ecoItem\">💬 Teams</div><div class=\"ecoItem\">📊 Excel</div><div class=\"ecoItem\">📄 Word</div><div class=\"ecoItem\">📽️ PowerPoint</div><div class=\"ecoItem\">☁️ OneDrive</div><div class=\"ecoItem\">✦ M365 Copilot Chat</div></div><div class=\"ecoArrow\">→</div><div class=\"ecosystemColumn ecosystemPurpose\"><span class=\"ecosystemLabel\">Purpose</span><div class=\"ecoItem\">Communication</div><div class=\"ecoItem\">Collaboration</div><div class=\"ecoItem\">Analysis</div><div class=\"ecoItem\">Documentation</div><div class=\"ecoItem\">Presentation</div><div class=\"ecoItem\">Data &amp; Storage</div><div class=\"ecoItem\">All of the above</div></div></div><div class=\"callout\">The right M365 Copilot depends on where the relevant context lives.</div></div></section>","<section class=\"slide center\"><div class=\"inner center\"><div class=\"slide20Centered\"><div class=\"eyebrow\">M365 Copilot in Everyday Work</div><h2>Start with Outlook and Teams</h2><p class=\"sub\">M365 Copilot helps Maya move faster in the communication and collaboration tools she already uses.</p><div class=\"grid grid2x2 compact\"><div class=\"card\"><div class=\"ico\">📧</div><h3>Outlook</h3><p>Summarize email threads, identify important messages and create first drafts for Maya to review.</p></div><div class=\"card\"><div class=\"ico\">💬</div><h3>Teams</h3><p>Catch up on chats and meetings, surface decisions and organize action items.</p></div></div><div class=\"callout\">Use Outlook for communication context and Teams for collaboration context. Maya reviews the output and makes the final decision.</div></div></div></section>","<section class=\"slide \"><div class=\"inner \"><div class=\"usePage\"><div class=\"useHead\"><div><div class=\"eyebrow\">Outlook Usecase 1: Meeting Prepper</div><h2>Meeting Prepper</h2><p class=\"sub\">Maya has an important stakeholder meeting in 15 minutes.</p></div></div><div class=\"useGrid\"><div class=\"usePanel\"><h3>M365 Copilot in Everyday Work</h3><p>M365 Copilot helps Maya move faster in the communication and collaboration tools she already uses.</p><div class=\"appPair\"><div class=\"appMini\"><b>Outlook</b><br>Summarize email threads, identify important messages and create first drafts for Maya to review.</div><div class=\"appMini\"><b>Teams</b><br>Catch up on chats and meetings, surface decisions and organize action items.</div></div></div><div class=\"usePanel alt\"><h3>Stakeholder briefing</h3><div class=\"useGrid\"><div><h3>Before</h3><div class=\"useList\"><div class=\"useItem\">Recent discussion topics</div><div class=\"useItem\">Open requests</div><div class=\"useItem\">Commitments</div><div class=\"useItem\">Unresolved questions</div></div></div><div><h3>After</h3><div class=\"useList\"><div class=\"useItem\">Main topics</div><div class=\"useItem\">Open context</div><div class=\"useItem\">Useful talking points</div><div class=\"useItem\">Intelligent follow-up</div></div></div></div></div></div><div class=\"callout\"><b>Key takeaway:</b> Use Outlook for communication context and Teams for collaboration context. Maya reviews the output and makes the final decision. This is relationship context, not simply an email summary.</div></div></div></section>","<section class=\"slide \"><div class=\"inner \"><div class=\"usePage\"><div class=\"useHead\"><div><div class=\"eyebrow\">Outlook Usecase 2: Communication Readiness Check</div><h2>Communication Readiness Check</h2><p class=\"sub\">Maya needs to communicate a significant change to different audiences.</p></div></div><div class=\"useGrid\"><div class=\"usePanel\"><h3>Inputs</h3><div class=\"useList\"><div class=\"useItem\">Process update</div><div class=\"useItem\">New initiative</div><div class=\"useItem\">Shift in deadline</div></div><p class=\"pptQuote\">Maya can <span class=\"grad\">anticipate likely questions or objections</span> before the message is sent and prepare for follow-up.</p></div><div class=\"usePanel alt\"><h3>Audience perspectives</h3><div class=\"useList\"><div class=\"useItem\"><b>Leaders</b><br>Likely concerns.</div><div class=\"useItem\"><b>Stakeholders</b><br>Misunderstandings and risks.</div><div class=\"useItem\"><b>Teams</b><br>Questions and impact.</div></div><p>Perspective taking creates a more considered starting point.</p></div></div><div class=\"callout\"><b>Key takeaway:</b> M365 Copilot helps Maya anticipate reaction; Maya decides what needs clarification. M365 Copilot supports awareness; it does not guarantee or predict every reaction.</div></div></div></section>","<section class=\"slide \"><div class=\"inner \"><div class=\"usePage\"><div class=\"useHead\"><div><div class=\"eyebrow\">Teams Usecase 1</div><h2>Personal Action Radar</h2><p class=\"sub\">Maya has agreed to actions across channels, group chats, meeting chats, and quick messages.</p></div></div><div class=\"useGrid\"><div class=\"usePanel\"><h3>Where did the last action item come from?</h3><p>Visibility helps Maya decide what deserves attention first.</p><div class=\"useFlow\"><span class=\"useChip\">Project channels</span><span class=\"useChip\">Group chats</span><span class=\"useChip\">Meeting chats</span><span class=\"useChip\">Quick messages</span><span class=\"useArrow\">→</span><span class=\"useChip\">Personal action view</span></div><p class=\"pptQuote\">“A chat request, a meeting comment, or a quick ‘I can take that’ can become real work without appearing in one central view.”</p></div><div class=\"usePanel alt\"><h3>Personal action view</h3><div class=\"useList\"><div class=\"useItem\"><b>Action Agreed To</b><br>What Maya committed to.</div><div class=\"useItem\"><b>Source Conversation</b><br>Where the commitment came from.</div><div class=\"useItem\"><b>Enough Context</b><br>Why the action matters.</div><div class=\"useItem\"><b>Next Step</b><br>What deserves attention now.</div></div></div></div><div class=\"callout\"><b>Prompt:</b> Review my recent emails, chats, meeting notes, and channel conversations. Identify commitments, action items, follow-ups, and requests assigned to me. Show where each item originated, highlight anything overdue, and organize the results by urgency and recommend next steps.</div></div></div></section>","<section class=\"slide \"><div class=\"inner \"><div class=\"usePage\"><div class=\"useHead\"><div><div class=\"eyebrow\">Teams Usecase 2</div><h2>Expertise Finder</h2><p class=\"sub\">Maya needs specialist knowledge but does not know who has solved a similar problem.</p></div></div><div class=\"useGrid\"><div class=\"usePanel\"><h3>The answer exists somewhere</h3><p>Expertise Finder is useful when joining a new project, needing a niche skill, or looking for a relevant example.</p><div class=\"useList\"><div class=\"useItem\">Organizational conversations</div><div class=\"useItem\">Connected projects</div><div class=\"useItem\">Relevant past work</div><div class=\"useItem\">Related initiatives</div></div></div><div class=\"usePanel alt\"><h3>WHO CAN HELP?</h3><div class=\"useList\"><div class=\"useItem\">Potential experts</div><div class=\"useItem\">Useful starting points</div><div class=\"useItem\">Relevant work</div><div class=\"useItem\">Connected projects</div></div><p class=\"pptQuote\">Teams becomes a starting point for finding experience, not only a place for conversation.</p></div></div><div class=\"callout\"><b>Prompt:</b> I need help with Topic X. Find people, projects, discussions, documents, or previous work related to this topic. Recommend experts I should connect with and explain why they may be relevant based on their experience or involvement.</div></div></div></section>","<section class=\"slide \"><div class=\"inner \"><div class=\"eyebrow\">From Weekly Task to a High-Impact Newsletter</div><h2>From weekly task to a high-impact newsletter</h2><p class=\"sub\">Maya has turned a recurring task into a capable M365 Copilot-assisted workflow.</p><div class=\"flow\"><div class=\"node\">Before · A recurring weekly task</div><div class=\"arrow\">→</div><div class=\"node\">With M365 Copilot · Builds reusable guidance over time</div><div class=\"arrow\">→</div><div class=\"node\">After · A faster, consistent draft</div></div><div class=\"grid four compact\"><div class=\"card\"><div class=\"ico\">○</div><h3>Audience</h3><p>Who the newsletter is for.</p></div><div class=\"card\"><div class=\"ico\">◉</div><h3>Tone</h3><p>How the message should sound.</p></div><div class=\"card\"><div class=\"ico\">◌</div><h3>Structure</h3><p>Sections, length, and format.</p></div><div class=\"card\"><div class=\"ico\">◎</div><h3>Standards</h3><p>Examples, quality, and CTA style.</p></div></div></div></section>","<section class=\ "199\" cy=\"108\" r=\"8\" fill=\"#4a352b\"/><circle class=\"maya-pupil\" cx=\"143.5\" cy=\"105.5\" r=\"2.4\" fill=\"#fff\"/><circle class=\"maya-pupil\" cx=\"201.5\" cy=\"105.5\" r=\"2.4\" fill=\"#fff\"/><path class=\"maya-nose\" d=\"M168 109q-4 10 3 12\" fill=\"none\" stroke=\"#c88767\" stroke-width=\"3\" stroke-linecap=\"round\"/><path class=\"maya-mouth\" d=\"M128 124 Q160 145 192 124\" fill=\"none\" stroke=\"#8a563f\" stroke-width=\"6.5\" stroke-linecap=\"round\"/><circle class=\"maya-cheek\" cx=\"112\" cy=\"136\" r=\"10\" fill=\"#ff96ae\"/><circle class=\"maya-cheek\" cx=\"228\" cy=\"136\" r=\"10\" fill=\"#ff96ae\"/><circle cx=\"92\" cy=\"117\" r=\"9\" fill=\"none\" stroke=\"#ffe54f\" stroke-width=\"5\"/><circle cx=\"248\" cy=\"117\" r=\"9\" fill=\"none\" stroke=\"#ffe54f\" stroke-width=\"5\"/></g></svg><div class=\"name\">Maya · Project Lead</div></div></div></div></section>","<section class=\"slide \"><div class=\"inner \"><div class=\"row\"><div class=\"character maya-character\"><svg viewBox=\"0 0 340 330\" role=\"img\" aria-label=\"Maya animated character\"><ellipse cx=\"170\" cy=\"311\" rx=\"82\" ry=\"11\" fill=\"rgba(20,5,55,.25)\"/><g class=\"maya-arm-left happy\"><path d=\"M109 214 Q68 216 50 166\" stroke=\"#ffd39a\" stroke-width=\"25\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"49\" cy=\"161\" r=\"15\" fill=\"#ffd39a\"/></g><g class=\"maya-arm-right happy\"><path d=\"M231 214 Q272 212 289 166\" stroke=\"#ffd39a\" stroke-width=\"25\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"290\" cy=\"161\" r=\"15\" fill=\"#ffd39a\"/></g><path d=\"M91 303c5-78 35-126 79-126s75 48 80 126z\" fill=\"#402f87\"/><path d=\"M134 182h72l-36 98z\" fill=\"#f7f1ff\"/><path d=\"M160 183h20l-10 17z\" fill=\"#24173f\"/><circle cx=\"134\" cy=\"215\" r=\"7\" fill=\"#ffe34f\"/><g class=\"maya-head\"><ellipse class=\"maya-face-shape\" cx=\"170\" cy=\"111\" rx=\"75\" ry=\"78\"/><path d=\"M94 106c1-64 41-93 84-87 40 5 62 37 57 87-19-8-34-23-43-43-24 24-57 36-98 35z\" fill=\"#3b2822\"/><path d=\"M233 68c43 23 54 84 32 148-10 31-35 52-62 58 23-35 25-74 14-113z\" fill=\"#3b2822\"/><path class=\"maya-brow\" d=\"M115 84 Q130 79 145 84 M175 84 Q190 79 205 84\" fill=\"none\" stroke=\"#6b402f\" stroke-width=\"5.5\" stroke-linecap=\"round\"/><circle class=\"maya-eye\" cx=\"141\" cy=\"108\" r=\"8\" fill=\"#4a352b\"/><circle class=\"maya-eye right\" cx=\"199\" cy=\"108\" r=\"8\" fill=\"#4a352b\"/><circle class=\"maya-pupil\" cx=\"143.5\" cy=\"105.5\" r=\"2.4\" fill=\"#fff\"/><circle class=\"maya-pupil\" cx=\"201.5\" cy=\"105.5\" r=\"2.4\" fill=\"#fff\"/><path class=\"maya-nose\" d=\"M168 109q-4 10 3 12\" fill=\"none\" stroke=\"#c88767\" stroke-width=\"3\" stroke-linecap=\"round\"/><path class=\"maya-mouth\" d=\"M128 124 Q160 145 192 124\" fill=\"none\" stroke=\"#8a563f\" stroke-width=\"6.5\" stroke-linecap=\"round\"/><circle class=\"maya-cheek\" cx=\"112\" cy=\"136\" r=\"10\" fill=\"#ff96ae\"/><circle class=\"maya-cheek\" cx=\"228\" cy=\"136\" r=\"10\" fill=\"#ff96ae\"/><circle cx=\"92\" cy=\"117\" r=\"9\" fill=\"none\" stroke=\"#ffe54f\" stroke-width=\"5\"/><circle cx=\"248\" cy=\"117\" r=\"9\" fill=\"none\" stroke=\"#ffe54f\" stroke-width=\"5\"/></g></svg><div class=\"name\">Maya · Project Lead</div></div><div class=\"grow\"><div class=\"eyebrow\">So What Is an Agent?</div><h2>So What Is an Agent?</h2><p class=\"sub\">Copilot remains Maya's general-purpose assistant. An Agent carries the recurring guidance for work that returns.</p><div class=\"grid grid2x2 compact\"><div class=\"card\"><div class=\"ico\">○</div><h3>Audience</h3><p>Who the newsletter is for.</p></div><div class=\"card\"><div class=\"ico\">◉</div><h3>Tone</h3><p>How the message should sound.</p></div><div class=\"card\"><div class=\"ico\">▤</div><h3>Structure</h3><p>Sections, length, and format.</p></div><div class=\"card\"><div class=\"ico\">✓</div><h3>Standards</h3><p>Examples, quality, and CTA style.</p></div></div><div class=\"callout\">Instead of rebuilding the task setup each time, Maya can return to the same purpose-built assistant. Teach the approach once. Reuse it when the work returns.</div></div></div></div></section>","<section class=\"slide \"><div class=\"inner \"><div class=\"eyebrow\">Copilot Chat vs Agent</div><h2>Two Different Ways to Work</h2><p class=\"sub\">Choose based on whether Maya is exploring a need or repeating a process.</p><div class=\"separateCompare\"><div class=\"comparePanel\"><div class=\"ico\">◌</div><h3>Copilot Chat</h3><ul><li>Quick</li><li>Exploratory</li><li>Flexible</li><li>One-time</li></ul><div class=\"compareUse\"><b>Use when:</b> Maya needs ideas, summaries, or a new answer that does not yet require a fixed method.</div></div><div class=\"comparePanel agent\"><div class=\"ico\">✦</div><h3>Agent</h3><ul><li>Repeatable</li><li>Guidance-heavy</li><li>Rule-based</li><li>Consistent</li></ul><div class=\"compareUse\"><b>Use when:</b> Maya is repeating a process and needs recurring preferences, rules, and expected output to carry forward.</div></div></div><div class=\"callout\">Use Chat for a one-time need. Consider an Agent when Maya is repeating a process.</div></div></section>","<section class=\"slide \"><div class=\"inner \"><div class=\"eyebrow\">The Travel Planner Challenge</div><h2>The Travel Planner Challenge</h2><p class=\"sub\">The traveler wants a meaningful trip, not a generic or overpacked itinerary.</p><div class=\"grid four compact\"><div class=\"card\"><div class=\"ico\">⌖</div><h3>Destination Knowledge</h3><p>Understand the destination.</p></div><div class=\"card\"><div class=\"ico\">◉</div><h3>Vegetarian Preferences</h3><p>Carry dietary needs into the plan.</p></div><div class=\"card\"><div class=\"ico\">✦</div><h3>Authentic Experiences</h3><p>Include local and scenic places.</p></div><div class=\"card\"><div class=\"ico\">◷</div><h3>Planning Logic</h3><p>Use realistic pacing, route planning, and clear output structure.</p></div></div><div class=\"callout\">Copilot Chat can help create one personalized itinerary. But is this really a one-time need? The work is becoming preference-heavy, structured, and reusable.</div></div></section>","<section class=\"slide \"><div class=\"inner \"><div class=\"eyebrow\">Why Use an Agent Here?</div><h2>Why Use an Agent Here?</h2><p class=\"sub\">Suppose the same traveler plans four or more trips and carries the same preferences into each one.</p><div class=\"flow\"><div class=\"node\">Trip 1 · New destination</div><div class=\"node\">Trip 2 · Same preferences</div><div class=\"node\">Trip 3 · Same planning logic</div><div class=\"node\">Trip 4 · Same output format</div></div><div class=\"callout\"><b>Agent opportunity:</b> Keep the recurring preferences and method; change only the destination and trip details. Use an Agent when the process and preferences matter as much as the prompt.</div></div></section>","<section class=\"slide \"><div class=\"inner \"><div class=\"eyebrow\">How Do I Build an Agent?</div><h2>How do I build an agent?</h2><p class=\"sub\">Natural language is the recommended start.</p><div class=\"demoSteps\"><div class=\"demoStep\">1<br>OPEN<br><small>Agents → New agent</small></div><div class=\"demoStep\">2<br>DESCRIBE<br><small>Task, audience, inputs, output</small></div><div class=\"demoStep\">3<br>CONFIGURE<br><small>Name, description, instructions</small></div><div class=\"demoStep\">4<br>GROUND<br><small>Approved knowledge sources</small></div><div class=\"demoStep\">5<br>TEST<br><small>Realistic prompts and refinement</small></div></div><div class=\"callout\"><b>CREATE &amp; SHARE:</b> Select Create, then share under your organization's policy.</div></div></section>","<section class=\"slide \"><div class=\"inner \"><div class=\"eyebrow\">Team Challenge: Build a WFH Tracker Agent</div><h2>Team Challenge: Build a WFH Tracker Agent</h2><p class=\"sub\">Create a Copilot agent using the provided Excel file.</p><div class=\"grid three\"><div class=\"card\"><div class=\"ico\">1</div><h3>Use Provided File</h3><p>Employee name<br>Total days in month<br>Weekend days<br>Company holidays<br>Leaves taken<br>Office days attended</p></div><div class=\"card\"><div class=\"ico\">2</div><h3>Calculate</h3><p>Total working days = total days - weekends - holidays - leaves.<br><br>Required office days = 40% OF Total Working Days.</p></div><div class=\"card\"><div class=\"ico\">3</div><h3>Decide + Report</h3><p>Show the WFO status for each employee (Fulfilled/Not Fulfilled). For employees who have not met the requirement, display the exact number of additional days required to fulfill the WFO criteria.</p></div></div><div class=\"callout\">Summary view: employees analyzed · meeting criteria · not meeting · overall compliance · non-compliant list.<br><b>Your challenge: upload, calculate, decide, and report.</b></div></div></section>","<section class=\"slide \"><div class=\"inner \"><div class=\"eyebrow\">A Few Simple Build Tips</div><h2>A Few Simple Build Tips</h2><div class=\"grid four\"><div class=\"card\"><div class=\"ico\">1</div><h3>Use the Provided File</h3><p>Keep the supplied column names and structure.</p></div><div class=\"card\"><div class=\"ico\">2</div><h3>Validate First</h3><p>Check blanks, negatives, duplicates, and impossible totals.</p></div><div class=\"card\"><div class=\"ico\">3</div><h3>Use Fixed Formulas</h3><p>Calculate working days and round the 40% target up.</p></div><div class=\"card\"><div class=\"ico\">4</div><h3>Show Clear Results</h3><p>Return status, additional days, and a short summary.</p></div></div><div class=\"flow\"><div class=\"node\">Provided File</div><div class=\"arrow\">→</div><div class=\"node\">Validate</div><div class=\"arrow\">→</div><div class=\"node\">Calculate</div><div class=\"arrow\">→</div><div class=\"node\">Report</div></div><div class=\"callout\">Use the file we provide → check the data → apply the formula → return the result.</div></div></section>","<section class=\"slide center\"><div class=\"inner center\
